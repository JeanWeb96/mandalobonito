name: Añadir issues al panel

on:
  issues:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Añadir el issue al panel JeanCode
        id: add
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/JeanWeb96/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: Asignar la empresa a la tarjeta
        if: steps.add.outputs.itemId != ''
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project=PVT_kwHOD62nS84BcAMM \
            -f item='${{ steps.add.outputs.itemId }}' \
            -f field=PVTSSF_lAHOD62nS84BcAMMzhWsbtQ \
            -f option=c0a921c3
